name: Sync NHL Stats (Pools)

# Declenche la synchronisation des matchs/stats NHL (Edge Function sync-nhl-stats) qui
# alimente le moteur de pointage des pools. Plusieurs executions par soiree + fin de nuit,
# heure de l'Est, pour couvrir les matchs qui finissent tard et les prolongations/tirs de
# barrage qui se terminent apres minuit.
#
# Les heures cron sont en UTC et calees sur l'heure normale de l'Est (EST, UTC-5, la
# majorite de la saison NHL) : 23h30, 1h30, 3h30 et 6h30 ET. Pendant l'heure avancee (EDT,
# UTC-4, en debut/fin de saison), ces executions tombent une heure plus tot cote horloge
# locale -- sans consequence, elles couvrent toujours la meme fenetre de matchs.
#
# Authentification : en-tete x-sync-secret = secret SYNC_CRON_SECRET (repo Settings > Secrets
# and variables > Actions), distinct de la cle service_role. La fonction compare cet en-tete
# a temps constant a sa propre variable d'environnement SYNC_CRON_SECRET (secret Supabase de
# la fonction, jamais dans le code). La verification JWT est desactivee pour cette fonction
# (supabase/config.toml) : aucun en-tete Authorization n'est necessaire ici.
on:
  schedule:
    - cron: '30 4 * * *'   # ~23h30 ET
    - cron: '30 6 * * *'   # ~1h30 ET
    - cron: '30 8 * * *'   # ~3h30 ET
    - cron: '30 11 * * *'  # ~6h30 ET
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Date de debut (YYYY-MM-DD), optionnel -- laisser vide pour la plage par defaut'
        required: false
      end_date:
        description: 'Date de fin (YYYY-MM-DD), optionnel'
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler l'Edge Function sync-nhl-stats
        run: |
          body=$(jq -n \
            --arg start_date "${{ github.event.inputs.start_date }}" \
            --arg end_date "${{ github.event.inputs.end_date }}" \
            '{} + (if $start_date != "" then {start_date: $start_date} else {} end) + (if $end_date != "" then {end_date: $end_date} else {} end)')

          http_response=$(curl -sS -w "\n%{http_code}" -X POST \
            "https://gjuxwzpylonusvogqpjw.supabase.co/functions/v1/sync-nhl-stats" \
            -H "x-sync-secret: ${{ secrets.SYNC_CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "$body")

          http_code=$(echo "$http_response" | tail -n1)
          response_body=$(echo "$http_response" | sed '$d')

          echo "Code HTTP : $http_code"
          echo "Reponse : $response_body"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::sync-nhl-stats a echoue (HTTP $http_code) -- voir la reponse ci-dessus."
            exit 1
          fi
