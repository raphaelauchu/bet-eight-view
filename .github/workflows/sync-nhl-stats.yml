name: Sync NHL Stats (Pools)

# Declenche la synchronisation des matchs/stats NHL (Edge Function sync-nhl-stats) qui
# alimente le moteur de pointage des pools. Plusieurs executions par soiree + fin de nuit,
# heure de l'Est, pour couvrir les matchs qui finissent tard et les prolongations/tirs de
# barrage qui se terminent apres minuit.
#
# Les heures cron sont en UTC et calees sur l'heure normale de l'Est (EST, UTC-5, la
# majorite de la saison NHL) : 23h30, 1h30, 3h30 et 6h30 ET. Pendant l'heure avancee (EDT,
# UTC-4, en debut/fin de saison), ces executions tombent une heure plus tot cote horloge
# locale -- sans consequence, elles couvrent toujours la meme fenetre de matchs.
on:
  schedule:
    - cron: '30 4 * * *'   # ~23h30 ET
    - cron: '30 6 * * *'   # ~1h30 ET
    - cron: '30 8 * * *'   # ~3h30 ET
    - cron: '30 11 * * *'  # ~6h30 ET
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler l'Edge Function sync-nhl-stats
        run: |
          curl -sS --fail-with-body -X POST \
            "https://gjuxwzpylonusvogqpjw.supabase.co/functions/v1/sync-nhl-stats" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
