name: Sync NHL Stats (Pools)

# Declenche la synchronisation des matchs/stats NHL (Edge Function sync-nhl-stats) qui
# alimente le moteur de pointage des pools.
#
# Horaires (UTC) :
# - Toutes les 30 min de 23h00 a 06h00 UTC : couvre les matchs du soir, leurs prolongations
#   et tirs de barrage qui se terminent souvent apres minuit ET.
#     * Heure avancee de l'Est (EDT, UTC-4, jusqu'au 1er novembre 2026) : 19h00 a 02h00 ET.
#     * Heure normale de l'Est (EST, UTC-5, a partir du 1er novembre 2026) : 18h00 a 01h00 ET.
# - 09h07 UTC : rattrapage matinal (matchs/stats qui auraient fini d'etre confirmes tard).
#     * EDT : ~05h07 ET.  EST : ~04h07 ET.
# - 15h23 UTC : rattrapage pour les matchs d'apres-midi (debuts de saison/playoffs, matchs
#   matinaux rares) et toute statistique tardive non encore officielle la veille.
#     * EDT : ~11h23 ET.  EST : ~10h23 ET.
# Les minutes des deux passages de rattrapage sont volontairement decalees de l'heure pile
# (7 et 23, pas 0) pour eviter la charge au pic des crons GitHub programmes a :00.
#
# Authentification : en-tete x-sync-secret = secret SYNC_CRON_SECRET (repo Settings > Secrets
# and variables > Actions), distinct de la cle service_role (non utilisee par ce workflow).
# La fonction compare cet en-tete a temps constant a sa propre variable d'environnement
# SYNC_CRON_SECRET (secret Supabase de la fonction, jamais dans le code). La verification JWT
# est desactivee pour cette fonction (supabase/config.toml) : aucun en-tete Authorization
# n'est necessaire ici.
on:
  schedule:
    - cron: '0,30 23,0,1,2,3,4,5,6 * * *'  # toutes les 30 min, 23h-6h UTC (voir ET ci-dessus)
    - cron: '7 9 * * *'                     # rattrapage matinal, ~09h07 UTC
    - cron: '23 15 * * *'                   # rattrapage apres-midi, ~15h23 UTC
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Date de debut (YYYY-MM-DD), optionnel -- laisser vide pour la plage par defaut'
        required: false
      end_date:
        description: 'Date de fin (YYYY-MM-DD), optionnel'
        required: false

# Une seule synchronisation a la fois : les executions rapprochees (toutes les 30 min) se
# mettent en file plutot que de se chevaucher ou de s'annuler (cancel-in-progress: false), le
# travail en cours doit toujours aller a son terme.
concurrency:
  group: sync-nhl-stats
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler l'Edge Function sync-nhl-stats
        run: |
          body=$(jq -n \
            --arg start_date "${{ github.event.inputs.start_date }}" \
            --arg end_date "${{ github.event.inputs.end_date }}" \
            '{} + (if $start_date != "" then {start_date: $start_date} else {} end) + (if $end_date != "" then {end_date: $end_date} else {} end)')

          http_response=$(curl -sS -w "\n%{http_code}" -X POST \
            "https://gjuxwzpylonusvogqpjw.supabase.co/functions/v1/sync-nhl-stats" \
            -H "x-sync-secret: ${{ secrets.SYNC_CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "$body")

          http_code=$(echo "$http_response" | tail -n1)
          response_body=$(echo "$http_response" | sed '$d')

          echo "Code HTTP : $http_code"
          echo "Reponse : $response_body"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::sync-nhl-stats a echoue (HTTP $http_code) -- voir la reponse ci-dessus."
            exit 1
          fi
