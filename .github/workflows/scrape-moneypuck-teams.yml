name: Scrape MoneyPuck Team Stats

on:
  schedule:
    # Jours impairs du mois -> 6h UTC
    - cron: '0 6 1-31/2 * *'
    # Jours pairs du mois -> 7h UTC
    - cron: '0 7 2-31/2 * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install requests pandas

      - name: Lancer le scraper MoneyPuck teams
        run: python moneypuck_team_stats.py

      - name: Commit et push le JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/moneypuck_team_stats.json
          git diff --staged --quiet || git commit -m "chore: mise à jour stats équipe MoneyPuck $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
