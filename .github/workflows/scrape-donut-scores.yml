name: Compute Donut Matchup Scores

on:
  schedule:
    # Tourne apres scrape-moneypuck-teams.yml et scrape-moneypuck-players.yml (6h/7h UTC),
    # une fois par jour avant les matchs du soir.
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install requests

      - name: Calculer les scores de matchup (donut)
        run: python compute_donut_scores.py

      - name: Commit et push le JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/donut_scores.json
          git diff --staged --quiet || git commit -m "chore: mise à jour scores donut $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
